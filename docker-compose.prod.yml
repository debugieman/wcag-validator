services:
  backend:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    volumes:
      - db-data:/app/data
    env_file:
      - path: .env
        required: true
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/wcag-analyzer.db
      - App__BaseUrl=${App__BaseUrl}
      - App__CorsOrigins=${App__CorsOrigins}
      - App__BehindProxy=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  # Daily SQLite backup, rotated to the last BACKUP_KEEP_COUNT (default 14)
  # copies. Runs one backup immediately on startup, then on a cron schedule.
  # Backups live in their own volume (db-backups) — still on the same host,
  # so this protects against accidental deletion/corruption/bad migrations,
  # but NOT against total disk/host failure. For that, sync db-backups
  # off-site (e.g. rclone to object storage, or scp to another machine).
  backup:
    image: alpine:3.22
    environment:
      - BACKUP_KEEP_COUNT=${BACKUP_KEEP_COUNT:-14}
    volumes:
      - db-data:/app/data:ro
      - db-backups:/backups
      - ./scripts/backup-db.sh:/backup-db.sh:ro
    depends_on:
      backend:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache sqlite >/dev/null
        /backup-db.sh
        echo '0 3 * * * /backup-db.sh >> /proc/1/fd/1 2>&1' > /etc/crontabs/root
        exec crond -f -l 2
    restart: unless-stopped

  # Uptime check against the public /api/health endpoint (through Caddy, so it
  # also catches TLS/routing failures, not just "is the backend process alive").
  # Runs every 2 minutes; after HEALTH_FAIL_THRESHOLD consecutive failures (default
  # 3, so ~6 min of real downtime) sends one alert email via Resend, then stays
  # quiet until recovery, which sends one more email. State lives in its own
  # volume so a container restart doesn't re-fire an alert for an already-known
  # outage. Self-hosted on the same host as the app it's checking — it can't
  # catch "the whole server is down". Pair with a free external checker
  # (UptimeRobot/Healthchecks.io) once the domain is live for that case.
  monitor:
    image: alpine:3.22
    environment:
      - App__BaseUrl=${App__BaseUrl}
      - Resend__ApiKey=${Resend__ApiKey}
      - Alert__Email=${Alert__Email}
      - HEALTH_FAIL_THRESHOLD=${HEALTH_FAIL_THRESHOLD:-3}
    volumes:
      - monitor-state:/state
      - ./scripts/health-check.sh:/health-check.sh:ro
    depends_on:
      - caddy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache curl >/dev/null
        echo '*/2 * * * * /health-check.sh >> /proc/1/fd/1 2>&1' > /etc/crontabs/root
        exec crond -f -l 2
    restart: unless-stopped

volumes:
  db-data:
  db-backups:
  caddy-data:
  caddy-config:
  monitor-state:
